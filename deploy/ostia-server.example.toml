data_dir = "/var/lib/ostia-server"
log_level = "info"

[domains]
api = "api.example.com"
share = "example-share.net"
relay = "r.example.com"
scheme = "https"

[listen]
https = ":443"
http = ""
client_ip_header = ""

[tls]
mode = "files"
forward_addr = ""

[[tls.certs]]
cert = "/etc/ostia-server/certs/api.pem"
key = "/etc/ostia-server/certs/api.key"

[[tls.certs]]
cert = "/etc/ostia-server/certs/share.pem"
key = "/etc/ostia-server/certs/share.key"

[modules]
relay = true
publish = true
sync = true
push = false

[auth]
github_client_id = ""
github_base_url = "https://github.com"
github_api_url = "https://api.github.com"
session_ttl = "1h0m0s"
max_devices_per_account = 10
invite_ttl = "168h0m0s"
device_invite_ttl = "10m0s"

[relay]
max_streams_per_label = 8
connections_per_minute = 30
connections_per_minute_per_ip = 10
monthly_bytes_per_account = 5368709120
idle_timeout = "10m0s"
ping_interval = "25s"
accept_timeout = "10s"
hello_timeout = "5s"
max_pending_hellos = 1024

[publish]
max_file_bytes = 16777216
max_shares_per_account = 100
max_bytes_per_account = 524288000
min_expiry = "1m0s"
default_expiry = "720h0m0s"
max_expiry = "8760h0m0s"
allow_never = false
allow_public = true
sweep_interval = "1h0m0s"

[sync]
max_blob_bytes = 16777216
max_manifest_bytes = 4194304
quota_bytes = 536870912
manifest_history = 10
gc_grace = "1h0m0s"

[push]
max_handles = 100000

[push.fcm]
service_account_file = ""
endpoint = ""

[push.apns]
key_file = ""
key_id = ""
team_id = ""
topic = ""
production = false
endpoint = ""
