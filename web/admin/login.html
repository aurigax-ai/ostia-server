{{define "body"}}
<div class="center">
<div class="card">
<h1 class="title">Ostia server · admin</h1>
<p class="hint">{{.Host}}</p>
{{if .Setup}}
<form method="post" action="/admin/github/start" class="stack">
<p class="strong">Set up admin</p>
<input class="mono" name="code" placeholder="Setup code" autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus required>
{{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
<button class="btn">Continue with GitHub</button>
</form>
<p class="hint">The GitHub account that finishes this setup becomes the admin. The code works once.</p>
{{else}}
<form method="post" action="/admin/github/start" class="stack">
{{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
<button class="btn" autofocus>Sign in with GitHub</button>
</form>
{{end}}
</div>
</div>
{{end}}
