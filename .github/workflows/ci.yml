name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o /dev/null ./cmd/ostia-server

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: go test ./internal/sni -run '^$' -fuzz FuzzPeek -fuzztime 30s
      - run: go test ./internal/sni -run '^$' -fuzz FuzzReadProxyV2 -fuzztime 15s

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: node --test 'web/share-shell/*.test.mjs' 'testdata/vectors/*.test.mjs'
      - run: npm install --no-save --no-package-lock playwright-core
      - run: CHROME_PATH=/usr/bin/google-chrome node --test web/share-shell/shell.browser.test.mjs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: docker build -f deploy/Dockerfile -t ostia-server:ci .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, fuzz, web, image]
    concurrency:
      group: publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=main-${{ steps.sha.outputs.short }}
          tags: |
            ghcr.io/aurigax-ai/ostia-server:main-${{ steps.sha.outputs.short }}
            ghcr.io/aurigax-ai/ostia-server:main
